<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FOREX ቻርት</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body { background:#1a1a2e; color:white; font-family:sans-serif; text-align:center; margin:0; padding:10px; }
    select { font-size:18px; padding:8px; margin:8px; }
    button { background:#2a2a4e; color:white; border:none; padding:10px 14px; margin:3px; border-radius:6px; font-size:15px; }
    button.on { background:#e94560; }
    #chart { width:100%; height:350px; }
    #price { font-size:22px; color:#e94560; }
    #chg { font-size:18px; margin:4px; }
    .up { color:#26a69a; }
    .down { color:#e94560; }
  </style>
</head>
<body>
  <h2>FOREX ቻርት</h2>
  <select id="pair" onchange="load()">
    <option value="EUR,USD">EUR/USD</option>
    <option value="GBP,USD">GBP/USD</option>
    <option value="USD,JPY">USD/JPY</option>
    <option value="USD,ETB">USD/ETB</option>
  </select>
  <div id="price">...</div>
  <div id="chg"></div>
  <div>
    <button id="d30" onclick="setDays(30)">1 ወር</button>
    <button id="d90" class="on" onclick="setDays(90)">3 ወር</button>
    <button id="d365" onclick="setDays(365)">1 ዓመት</button>
  </div>
  <div>
    <button id="tline" class="on" onclick="setType('line')">መስመር</button>
    <button id="tcandle" onclick="setType('candle')">Candle</button>
  </div>
  <div id="chart"></div>

  <script>
    const chart = LightweightCharts.createChart(document.getElementById('chart'), {
      layout: { background: { color: '#1a1a2e' }, textColor: 'white' },
      grid: { vertLines: { color: '#2a2a4e' }, horzLines: { color: '#2a2a4e' } }
    });
    let series = null, closes = [], days = 90, type = 'line';

    function draw() {
      if (series) chart.removeSeries(series);
      if (type === 'line') {
        series = chart.addLineSeries({ color: '#e94560', lineWidth: 2 });
        series.setData(closes);
      } else {
        series = chart.addCandlestickSeries({
          upColor: '#26a69a', downColor: '#e94560', borderVisible: false,
          wickUpColor: '#26a69a', wickDownColor: '#e94560'
        });
        series.setData(closes.map((p, i) => {
          const open = i ? closes[i - 1].value : p.value;
          return { time: p.time, open: open, high: Math.max(open, p.value),
                   low: Math.min(open, p.value), close: p.value };
        }));
      }
      chart.timeScale().fitContent();
    }

    function setDays(d) {
      days = d;
      ['d30', 'd90', 'd365'].forEach(id => document.getElementById(id).classList.remove('on'));
      document.getElementById('d' + d).classList.add('on');
      load();
    }

    function setType(t) {
      type = t;
      document.getElementById('tline').classList.toggle('on', t === 'line');
      document.getElementById('tcandle').classList.toggle('on', t === 'candle');
      if (closes.length) draw();
    }

    async function load() {
      const [base, quote] = document.getElementById('pair').value.split(',');
      const end = new Date();
      const start = new Date(Date.now() - days * 86400000);
      const f = d => d.toISOString().slice(0, 10);
      const url = `https://api.frankfurter.dev/v1/${f(start)}..${f(end)}?base=${base}&symbols=${quote}`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        closes = Object.entries(data.rates).map(([date, r]) => ({ time: date, value: r[quote] }));
        draw();
        const first = closes[0].value;
        const last = closes[closes.length - 1].value;
        const pct = ((last - first) / first * 100).toFixed(2);
        document.getElementById('price').textContent = base + '/' + quote + ': ' + last;
        const chg = document.getElementById('chg');
        chg.textContent = (pct >= 0 ? '▲ +' : '▼ ') + pct + '%';
        chg.className = pct >= 0 ? 'up' : 'down';
      } catch (e) {
        document.getElementById('price').textContent = 'ዳታ ማምጣት አልተቻለም';
      }
    }
    load();
  </script>
</body>
</html>
