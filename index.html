<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FOREX ቻርት</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body { background:#1a1a2e; color:white; font-family:sans-serif; text-align:center; margin:0; padding:10px; }
    select { font-size:18px; padding:8px; margin:10px; }
    #chart { width:100%; height:350px; }
    #price { font-size:22px; color:#e94560; }
  </style>
</head>
<body>
  <h2>FOREX ቻርት</h2>
  <select id="pair" onchange="load()">
    <option value="EUR,USD">EUR/USD</option>
    <option value="GBP,USD">GBP/USD</option>
    <option value="USD,JPY">USD/JPY</option>
    <option value="USD,ETB">USD/ETB</option>
  </select>
  <div id="price">...</div>
  <div id="chart"></div>

  <script>
    const chart = LightweightCharts.createChart(document.getElementById('chart'), {
      layout: { background: { color: '#1a1a2e' }, textColor: 'white' },
      grid: { vertLines: { color: '#2a2a4e' }, horzLines: { color: '#2a2a4e' } }
    });
    const line = chart.addLineSeries({ color: '#e94560', lineWidth: 2 });

    async function load() {
      const [base, quote] = document.getElementById('pair').value.split(',');
      const end = new Date();
      const start = new Date(Date.now() - 90 * 86400000);
      const f = d => d.toISOString().slice(0, 10);
      const url = `https://api.frankfurter.dev/v1/${f(start)}..${f(end)}?base=${base}&symbols=${quote}`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        const points = Object.entries(data.rates).map(([date, r]) => ({ time: date, value: r[quote] }));
        line.setData(points);
        chart.timeScale().fitContent();
        document.getElementById('price').textContent =
          base + '/' + quote + ': ' + points[points.length - 1].value;
      } catch (e) {
        document.getElementById('price').textContent = 'ዳታ ማምጣት አልተቻለም';
      }
    }
    load();
  </script>
</body>
</html>
